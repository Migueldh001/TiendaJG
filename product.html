    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <title>Producto - Virtual JG</title>

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="assets/logo.png">
    <link rel="apple-touch-icon" href="assets/logo.png">

    <!-- CSS -->
    <link rel="stylesheet" href="css/global.css">

    <!-- Meta dinámica para SEO (se actualiza por JS) -->
    <meta name="description" id="meta-description" content="Producto en Virtual JG">
    <meta property="og:title" id="og-title" content="Virtual JG">
    <meta property="og:description" id="og-description" content="Producto en Virtual JG">
    <meta property="og:image" id="og-image" content="assets/iso.png">
</head>

<body data-page="product">
     <!-- LIMPIEZA INTELIGENTE (solo una vez) -->
    <script>
    (function() {
        window.scrollTo(0, 0);

        // Solo limpiar caché si es la primera vez en esta versión
        var APP_VERSION = '1.1.0';
        var lastVersion = localStorage.getItem('vjg_app_version');

        if (lastVersion !== APP_VERSION) {
            console.log('Nueva versión detectada, limpiando caché...');

            // Desregistrar SW viejos
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then(function(registrations) {
                    registrations.forEach(function(reg) { reg.unregister(); });
                });
            }

            // Limpiar caches
            if ('caches' in window) {
                caches.keys().then(function(keys) {
                    keys.forEach(function(key) { caches.delete(key); });
                });
            }

            localStorage.setItem('vjg_app_version', APP_VERSION);

            // Recargar una sola vez después de limpiar
            if (!sessionStorage.getItem('vjg_reloaded')) {
                sessionStorage.setItem('vjg_reloaded', '1');
                setTimeout(function() {
                    window.location.reload();
                }, 500);
                return;
            }
        }

        // Limpiar la bandera de recarga
        sessionStorage.removeItem('vjg_reloaded');

        // Seguridad: quitar splash después de 6 segundos
        setTimeout(function() {
            var splash = document.getElementById('app-splash');
            if (splash) {
                splash.style.display = 'none';
                try { splash.remove(); } catch(e) {}
            }
            window.scrollTo(0, 0);
        }, 6000);
    })();
    </script>

    <!-- SPLASH SCREEN -->
    <div id="app-splash" style="
        position:fixed;inset:0;
        background:rgba(10,18,36,0.5);
        backdrop-filter:blur(16px);
        -webkit-backdrop-filter:blur(16px);
        display:flex;align-items:center;justify-content:center;
        z-index:99999;transition:all 0.5s ease">
        <div style="
            background:linear-gradient(145deg,rgba(255,255,255,0.97),rgba(248,250,252,0.97));
            border-radius:28px;
            padding:48px 56px;
            display:flex;flex-direction:column;align-items:center;
            gap:14px;
            box-shadow:0 32px 100px rgba(0,0,0,0.25),0 0 0 1px rgba(255,255,255,0.8);
            max-width:360px;width:92%;text-align:center;
            border:1px solid rgba(255,255,255,0.6)">

            <div style="font-size:16px;color:#94a3b8;font-weight:600;letter-spacing:1px;
                        text-transform:uppercase">
                Bienvenido a
            </div>

            <img src="assets/iso.png" alt="Virtual JG"
                 style="height:88px;width:auto;margin:6px 0;
                        filter:drop-shadow(0 4px 12px rgba(26,58,92,0.2))"
                 onerror="this.outerHTML='<div style=\'font-size:32px;font-weight:800;color:#1a3a5c;margin:10px 0\'>Virtual JG</div>'">

            <div style="position:relative;width:76px;height:76px;margin:12px 0 6px">
                <svg width="76" height="76" viewBox="0 0 76 76" style="transform:rotate(-90deg)">
                    <circle cx="38" cy="38" r="33" fill="none" stroke="#e2e8f0" stroke-width="5"/>
                    <circle cx="38" cy="38" r="33" fill="none"
                            stroke="url(#splash-gradient)" stroke-width="5"
                            stroke-dasharray="207" stroke-dashoffset="207" stroke-linecap="round"
                            id="splash-progress-circle"
                            style="transition:stroke-dashoffset 0.4s ease"/>
                    <defs>
                        <linearGradient id="splash-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" style="stop-color:#1a3a5c"/>
                            <stop offset="100%" style="stop-color:#f97316"/>
                        </linearGradient>
                    </defs>
                </svg>
                <div id="splash-percent" style="
                    position:absolute;inset:0;display:flex;
                    align-items:center;justify-content:center;
                    font-size:17px;font-weight:800;
                    background:linear-gradient(135deg,#1a3a5c,#f97316);
                    -webkit-background-clip:text;
                    -webkit-text-fill-color:transparent;
                    background-clip:text">
                    0%
                </div>
            </div>

            <div id="splash-status" style="
                font-size:14px;color:#64748b;font-weight:500;
                min-height:22px;transition:opacity 0.3s">
                Iniciando...
            </div>

            <div style="display:flex;gap:4px;margin-top:4px">
                <div style="width:6px;height:6px;border-radius:50%;background:#1a3a5c;animation:pulse 1.5s infinite"></div>
                <div style="width:6px;height:6px;border-radius:50%;background:#f97316;animation:pulse 1.5s infinite 0.3s"></div>
                <div style="width:6px;height:6px;border-radius:50%;background:#1a3a5c;animation:pulse 1.5s infinite 0.6s"></div>
            </div>
        </div>
    </div>

    <div class="app-wrapper">

        <!-- HEADER -->
        <header class="header" id="main-header"></header>

        <div class="main-layout">

            <!-- SIDEBAR -->
            <aside class="sidebar collapsed" id="sidebar"></aside>
            <div class="sidebar-overlay" id="sidebar-overlay"></div>

            <!-- CONTENIDO -->
            <main class="main-content" id="main-content">
                <div class="home-container">

                    <!-- Breadcrumb -->
                    <nav style="display:flex;align-items:center;gap:8px;
                                font-size:13px;color:var(--text-muted);
                                margin-bottom:16px;flex-wrap:wrap">
                        <a href="index.html" style="color:var(--color-primary)">🏪 Inicio</a>
                        <span>›</span>
                        <span id="product-breadcrumb">Producto</span>
                    </nav>

                    <!-- Contenido del producto (renderizado en modal) -->
                    <div id="product-page-content"
                         style="background:var(--bg-card);border-radius:var(--border-radius-xl);
                                border:1px solid var(--border-color);overflow:hidden;
                                box-shadow:var(--shadow-lg)">
                        <div class="empty-state">
                            <div class="spinner spinner-lg"></div>
                            <p>Cargando producto...</p>
                        </div>
                    </div>

                </div>

                <div style="height:var(--space-16)"></div>
            </main>

        </div>
    </div>

    <!-- Modal producto (también se usa aquí) -->
    <div class="product-modal-overlay" id="product-modal-overlay" style="display:none">
        <div class="product-modal">
            <button class="product-modal-close"
                    onclick="ProductsManager.closeProductModal()">✕</button>
            <div class="product-modal-content"></div>
        </div>
    </div>

    <div class="toast-container" id="toast-container"></div>
    <button class="back-to-top" id="back-to-top">↑</button>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/currency.js"></script>
    <script src="js/products.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/filters.js"></script>
    <script src="js/reviews.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/pwa.js"></script>
    <script src="js/admin.js"></script>
    <script src="js/vendor.js"></script>
    <script src="js/app.js"></script>

    <script>
        // En product.html, cargar el producto directamente en la página
        // además de abrirlo como modal
        document.addEventListener('DOMContentLoaded', async () => {
            const params    = new URLSearchParams(window.location.search);
            const productId = params.get('id');

            if (!productId) {
                window.location.href = 'index.html';
                return;
            }

            // Esperar a que ProductsManager esté listo
            setTimeout(async () => {
                const product = await ProductsManager.loadProduct(productId);

                if (!product) {
                    document.getElementById('product-page-content').innerHTML = `
                        <div class="empty-state" style="padding:60px">
                            <span class="empty-state-icon">😕</span>
                            <h3>Producto no encontrado</h3>
                            <a href="index.html" class="btn btn-primary btn-sm">
                                ← Volver a la tienda
                            </a>
                        </div>
                    `;
                    return;
                }

                // Actualizar SEO meta tags
                document.title = `${product.name} - Virtual JG`;
                document.getElementById('meta-description')?.setAttribute(
                    'content', product.description || product.name
                );
                document.getElementById('og-title')?.setAttribute(
                    'content', product.name
                );

                const img = VJG.UI.getProductMainImage(product.images);
                if (img) {
                    document.getElementById('og-image')?.setAttribute('content', img);
                }

                // Breadcrumb
                const breadcrumb = document.getElementById('product-breadcrumb');
                if (breadcrumb) {
                    breadcrumb.innerHTML = `
                        ${product.category_name
                            ? `<a href="index.html?category=${product.category_slug}"
                                  style="color:var(--color-primary)">
                                   ${product.category_icon} ${product.category_name}
                               </a> › `
                            : ''
                        }
                        <span>${product.name}</span>
                    `;
                }

                // Renderizar producto en la página
                ProductsManager._currentProduct = product;
                const content = document.getElementById('product-page-content');
                if (content) {
                    content.innerHTML = '';
                    ProductsManager._renderProductModal(product);

                    // Mover contenido del modal al contenedor de página
                    const modalContent = document.querySelector('#product-modal-overlay .product-modal-content');
                    if (modalContent) {
                        content.innerHTML = modalContent.innerHTML;
                    }

                    // Cargar reseñas
                    ReviewsManager.loadForProduct(product.id);

                    // Cargar relacionados
                    ProductsManager._loadRelatedProducts(product);
                }

            }, 800);
        });
    </script>
</body>
</html>
